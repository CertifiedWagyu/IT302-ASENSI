services:
  nginx:
    image: nginx:alpine
    container_name: it302-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - it302_network

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: it302-php
    restart: always
    volumes:
      - ./app:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      - mysql
    networks:
      - it302_network

  mysql:
    image: mysql:8.0
    container_name: it302-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: it302_asensi
      MYSQL_DATABASE: it302_asensi
      MYSQL_USER: it302_asensi
      MYSQL_PASSWORD: it302_asensi
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - it302_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: it302-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - it302_network

  workspace:
    image: devilbox/php-fpm:8.2-work
    container_name: it302-workspace
    stdin_open: true
    tty: true
    volumes:
      - ./app:/var/www/html
      - ./workspace:/home/workspace
    networks:
      - it302_network

  redis:
    image: redis:alpine
    container_name: it302-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - it302_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: it302-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - it302_network

networks:
  it302_network:
    driver: bridge